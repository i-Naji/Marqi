[package]
name = "marqi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A live-preview TUI markdown editor (GitHub Flavored Markdown)"
authors = ["Naji"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/i-naji/marqi"
homepage = "https://github.com/i-naji/marqi"
keywords = ["markdown", "editor", "tui", "terminal", "gfm"]
categories = ["text-editors", "command-line-utilities"]
exclude = [".github/", ".idea/", "fixtures/", "/marqi", "/install.sh", "/install.ps1", "**/.DS_Store"]

[[bin]]
name = "marqi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
# `wayland-data-control` keeps the clipboard native on XWayland-free sessions;
# default features are off to skip image-data support we don't use.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
comrak = "0.52.0"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.1"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Optimized, slim binaries for distribution. Unwinding is kept (not `panic =
# "abort"`) so the panic hook in tui.rs can restore the terminal on a crash.
[profile.release]
lto = true
codegen-units = 1
strip = true
