[package]
name = "marqi"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A live-preview TUI markdown editor (GitHub Flavored Markdown)"
authors = ["Naji"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/i-naji/marqi"
homepage = "https://github.com/i-naji/marqi"
keywords = ["markdown", "editor", "tui", "terminal", "gfm"]
categories = ["text-editors", "command-line-utilities"]
exclude = [".github/", ".idea/", ".serena/", "assets/", "fixtures/", "/demo.tape", "/marqi", "/install.sh", "/install.ps1", "**/.DS_Store"]

[[bin]]
name = "marqi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# `wayland-data-control` keeps the clipboard native on XWayland-free sessions;
# default features are off to skip image-data support we don't use.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
comrak = "0.55.0"
crossterm = "0.29.0"
directories = "6.0.0"
# 0.30.2 minimum: its buffer diff repaints the trailing cells of wide glyphs
# (CJK/emoji) when overdrawn by same-styled blanks — the settings popup relies
# on this (see `ui::tests::menu_repaints_trailing_cells_of_wide_chars`).
ratatui = "0.30.2"
regex = "1.13.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd", "cr_lines"] }
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# Startup OSC 11 background query for the "auto" theme variant: queries
# /dev/tty directly (works with piped stdin) and DA1-fences the query so
# unsupported terminals answer immediately instead of timing out.
terminal-colorsaurus = "1.0.3"
toml = "1.1.5"
trash = "5.2.7"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[dev-dependencies]
libc = "0.2.189"

# Optimized, slim binaries for distribution. Unwinding is kept (not `panic =
# "abort"`) so the panic hook in tui.rs can restore the terminal on a crash.
[profile.release]
lto = true
codegen-units = 1
strip = true
